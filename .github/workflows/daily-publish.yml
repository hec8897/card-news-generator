name: Daily card news publish

on:
  schedule:
    - cron: '0 23 * * *' # 매일 08:00 KST (UTC+9) = 23:00 UTC 전날
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: node bin/publish.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STYLE: ${{ secrets.STYLE }}
