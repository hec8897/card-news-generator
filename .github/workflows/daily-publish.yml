name: Daily card news publish

on:
  # 자동 스케줄은 로컬 launchd로 이전 (토스증권 API가 IP 화이트리스트를 요구해 GitHub Actions에서 401/403).
  # 필요하면 수동 실행(workflow_dispatch)만 가능하게 유지.
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # .ts 네이티브 실행(타입 스트리핑)에 Node 23.6+ 필요

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: node bin/publish.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STYLE: ${{ secrets.STYLE }}
