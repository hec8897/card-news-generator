name: Daily card news publish

on:
  schedule:
    - cron: '0 23 * * *' # 매일 08:00 KST (UTC+9) = 23:00 UTC 전날
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-jammy # 크로미움이 이미 설치되어 있어 매번 설치할 필요 없음
    steps:
      - uses: actions/checkout@v4

      - run: npm install

      - run: node bin/publish.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STYLE: ${{ secrets.STYLE }}
